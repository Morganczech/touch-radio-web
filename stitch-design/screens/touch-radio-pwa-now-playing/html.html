    // Spectrum Bars Randomization Interval (Tactile live feedback)

      if (isPlaying) {
        spectrumBars.forEach(bar => {

    // Play/Pause Micro-interaction
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = 'pause';
        pulseRing.style.animationPlayState = 'running';
      } else {
        playIcon.textContent = 'play_arrow';
        pulseRing.style.animationPlayState = 'paused';
        spectrumBars.forEach(bar => bar.style.height = '10%');
      }
    });

    // Volume Slider & dB Calculation
    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      if (val === 0) {
        dbLevel.textContent = '-∞ dB';
        volIcon.textContent = 'volume_off';
      } else {
        const dB = ((val - 100) * 0.4).toFixed(1);
        dbLevel.textContent = `${dB} dB`;
        volIcon.textContent = val < 40 ? 'volume_down' : 'volume_up';
      }
    });

    // Mute Button Toggle
    let previousVol = 82;
    volMuteBtn.addEventListener('click', () => {
      if (parseInt(volumeSlider.value) > 0) {
        previousVol = volumeSlider.value;
        volumeSlider.value = 0;
        dbLevel.textContent = '-∞ dB';
        volIcon.textContent = 'volume_off';
      } else {
        volumeSlider.value = previousVol;
        const dB = ((previousVol - 100) * 0.4).toFixed(1);
        dbLevel.textContent = `${dB} dB`;
        volIcon.textContent = 'volume_up';
      }
    });

    // Stream Quality Toggle
    qualityBtn.addEventListener('click', () => {
      if (qualityLabel.textContent.includes('320k')) {
        qualityLabel.textContent = 'SAVER 128k';
      } else {
        qualityLabel.textContent = 'HQ 320k';
      }
    });

    // Sleep Timer Selector Highlight
    const timerChips = document.querySelectorAll('.timer-chip');
    timerChips.forEach(chip => {
      chip.addEventListener('click', () => {
        timerChips.forEach(c => {
          c.classList.remove('bg-surface-container-high', 'text-primary', 'shadow-inner');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-surface-container-high', 'text-primary', 'shadow-inner');
      });
    });
  })();
</script></main></body></html>
