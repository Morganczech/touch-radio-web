<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="radioGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#141721" stroke="#262B3D" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="16" fill="url(#pulseGlow)"/>
  <!-- Soundwave / Frequency pulse marks -->
  <line x1="12" y1="21" x2="12" y2="27" stroke="url(#radioGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="16" x2="18" y2="32" stroke="url(#radioGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="11" x2="24" y2="37" stroke="url(#radioGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="17" x2="30" y2="31" stroke="url(#radioGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="22" x2="36" y2="26" stroke="url(#radioGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="2.5" fill="#FFFFFF"/>
</svg>